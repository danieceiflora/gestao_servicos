upstream django_app {
    server web:8001;
}

# Servidor HTTP - Temporário até ter SSL
server {
    listen 80;
    server_name osonline.douradoscalhas.com.br;

    # Location para validação do Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Aumentar limite de upload se necessário (ex: 20M)
    client_max_body_size 200M;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 300s;

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Serve os arquivos estáticos diretamente pelo NGINX
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve os arquivos de media (uploads, vídeos, imagens)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

