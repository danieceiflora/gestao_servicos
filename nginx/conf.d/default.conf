upstream django_app {
    server web:8001;
}

server {
    listen 80;
    server_name _; # Pode ser alterado para o seu IP ou domínio futuramente

    # Aumentar limite de upload se necessário (ex: 20M)
    client_max_body_size 50M;

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host; # Garante o host correto para o Django
        proxy_redirect off;
    }

    # Serve os arquivos estáticos diretamente pelo NGINX
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve os arquivos de media (uploads, vídeos, imagens)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
