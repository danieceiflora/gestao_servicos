{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8 flex items-center gap-4">
        <a href="{% url 'integracoes:manual_message_config_list' %}"
           class="h-10 w-10 flex items-center justify-center rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 transition-colors">
            <i data-lucide="chevron-left" class="h-5 w-5"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ trigger_label }}</h1>
            <p class="text-sm text-slate-500">Configure o template WhatsApp disparado por esta ação.</p>
        </div>
    </div>

    <form method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        {# model_name fixo — passado para o HTMX de detalhes do template #}
        <input type="hidden" id="model_select" name="model_name" value="{{ model_name }}">

        <!-- Bloco: Ativo -->
        <div class="p-6 bg-white border border-slate-200 rounded-2xl shadow-sm">
            <label for="is_active" class="flex items-center gap-3 cursor-pointer select-none w-fit">
                <div class="relative">
                    <input type="checkbox" name="is_active" id="is_active"
                           {% if config.is_active %}checked{% endif %}
                           class="peer sr-only">
                    <div class="w-10 h-6 bg-slate-200 rounded-full transition-colors peer-checked:bg-emerald-500"></div>
                    <div class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full shadow transition-transform peer-checked:translate-x-4"></div>
                </div>
                <span class="text-sm font-medium text-slate-700">Ativar esta mensagem automática</span>
            </label>
        </div>

        <!-- Bloco: Template e Variáveis -->
        <div class="p-6 bg-white border border-slate-200 rounded-2xl shadow-sm space-y-6">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Template e Mapeamento de Variáveis</h2>

            <div class="space-y-2">
                <label class="text-sm font-bold text-slate-700">Template WhatsApp (Meta)</label>
                <select name="template_name" id="template_select" required
                        hx-get="{% url 'integracoes:ajax_get_template_details' %}"
                        hx-target="#template_details"
                        hx-trigger="change, load delay:100ms"
                        hx-include="#model_select"
                        hx-vals='{"manual_config_id": "{{ config.id|default:'' }}"}'
                        class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/5 focus:border-slate-900 transition-all">
                    <option value="">Selecione um template...</option>
                    {% for t in templates %}
                    <option value="{{ t.name }}" {% if config.template_name == t.name %}selected{% endif %}>
                        {{ t.name }} ({{ t.language }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Variáveis carregadas via AJAX -->
            <div id="template_details" class="space-y-6 pt-4 border-t border-slate-100">
                <div class="animate-pulse flex space-y-4 flex-col">
                    <div class="h-4 bg-slate-100 rounded w-3/4"></div>
                    <div class="h-20 bg-slate-50 rounded"></div>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4">
            <a href="{% url 'integracoes:manual_message_config_list' %}"
               class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">Cancelar</a>
            <button type="submit"
                    class="inline-flex items-center justify-center rounded-lg bg-slate-900 px-8 py-2 text-sm font-medium text-white hover:bg-slate-800 transition-all shadow-lg shadow-slate-900/10">
                Salvar Configuração
            </button>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    });
</script>
{% endblock %}
