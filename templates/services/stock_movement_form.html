{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <a href="{% url 'product_list' %}" class="p-2 text-slate-400 hover:text-slate-900 hover:bg-slate-100 rounded-xl transition-all">
            <i data-lucide="arrow-left" class="h-6 w-6"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Movimentar Estoque</h1>
            <p class="text-slate-500 text-sm">Registre entradas ou saídas manuais.</p>
        </div>
    </div>

    <!-- Form -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2 space-y-2">
                    <label class="text-sm font-semibold text-slate-700">Produto</label>
                    {{ form.product }}
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700">Quantidade</label>
                    {{ form.quantity }}
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700">Tipo de Movimento</label>
                    {{ form.movement_type }}
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700">Motivo</label>
                    {{ form.reason }}
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700">Ordem de Serviço (Opcional)</label>
                    {{ form.service_order }}
                </div>
            </div>

            <div class="flex gap-3 pt-6 border-t border-slate-100">
                <button type="submit" class="flex-1 bg-amber-500 text-white font-bold py-3 rounded-xl hover:bg-amber-600 transition-all shadow-sm active:scale-[0.98]">
                    Confirmar Movimentação
                </button>
                <a href="{% url 'product_list' %}" class="flex-1 bg-slate-100 text-slate-700 font-bold py-3 rounded-xl text-center hover:bg-slate-200 transition-all active:scale-[0.98]">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
