<!-- Modal de Finalização (Guided Workflow) -->
<div id="modal-finish" class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden max-h-[90vh] animate-in slide-in-from-bottom-full duration-300">
        <!-- Handlebar for mobile -->
        <div class="sm:hidden w-full flex justify-center pt-3 pb-1">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
        </div>

        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <div>
                <h3 class="font-bold text-slate-900 text-lg">Finalizar Serviço</h3>
                <p class="text-xs text-slate-500 font-medium">Coleta de assinatura e feedback</p>
            </div>
            <button id="btn-close-finish" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                <i data-lucide="x" class="h-5 w-5 text-slate-400"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Nome -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Nome de quem recebeu</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="user" class="h-4 w-4 text-slate-400"></i>
                    </div>
                    <input type="text" id="finish-customer-name" class="w-full pl-10 rounded-xl border-slate-200 bg-slate-50/50 text-sm focus:ring-blue-500 focus:border-blue-500 py-3" placeholder="Ex: Maria Silva">
                </div>
            </div>

            <!-- Notas -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Relatório / Observações</label>
                <textarea id="finish-notes" rows="3" class="w-full rounded-xl border-slate-200 bg-slate-50/50 text-sm focus:ring-blue-500 focus:border-blue-500 py-3 px-4" placeholder="Descreva brevemente o que foi realizado..."></textarea>
            </div>

            <!-- Assinatura -->
            <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Assinatura Digital</label>
                    <button id="btn-clear-signature" class="text-[10px] font-bold text-red-500 hover:text-red-700 uppercase tracking-wider">Limpar</button>
                </div>
                <div class="border-2 border-slate-100 rounded-2xl overflow-hidden bg-slate-50 relative group">
                    <canvas id="signature-pad" class="w-full h-48 touch-none"></canvas>
                    <div id="signature-placeholder" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none opacity-20 transition-opacity group-focus-within:opacity-0">
                        <i data-lucide="pen-tool" class="h-8 w-8 text-slate-400 mb-2"></i>
                        <p class="text-xs font-medium text-slate-500">Assine aqui</p>
                    </div>
                </div>
            </div>

            <!-- Pagamento (Opcional - Sprint 7) -->
            <div id="finish-payment-section" class="hidden space-y-4 pt-4 border-t border-slate-100">
                <div class="flex items-center justify-between">
                    <h4 class="text-sm font-bold text-slate-900 uppercase tracking-widest">Informar Recebimento <span class="text-[10px] font-medium text-slate-400 normal-case">(Opcional)</span></h4>
                    <span id="finish-balance-due" class="text-sm font-black text-red-600 tracking-tighter"></span>
                </div>
                
                <div id="finish-payment-methods-grid" class="grid grid-cols-3 gap-2">
                    <!-- Injetado via JS dinamicamente (OfflineDB.payment_methods) -->
                </div>

                <div id="payment-details" class="hidden animate-in fade-in slide-in-from-top-2 duration-200">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Valor Recebido</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-400">R$</span>
                        <input type="number" step="0.01" id="finish-payment-amount" class="w-full pl-10 pr-4 py-4 rounded-2xl bg-slate-50 border-2 border-slate-100 text-lg font-black text-slate-900 focus:border-blue-500 transition-all outline-none" placeholder="0,00">
                    </div>
                </div>
            </div>
        </div>

        <div class="p-6 bg-slate-50/80 backdrop-blur-sm border-t border-slate-100 safe-area-pb">
            <button id="btn-confirm-finish" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-xl shadow-slate-200 active:scale-95 transition-all flex items-center justify-center gap-2">
                <i data-lucide="check" class="h-5 w-5"></i>
                CONFIRMAR E FINALIZAR
            </button>
        </div>
    </div>
</div>

<!-- Modal de Ocorrência -->
<div id="modal-occurrence" class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden max-h-[90vh] animate-in slide-in-from-bottom-full duration-300">
        <div class="sm:hidden w-full flex justify-center pt-3 pb-1">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
        </div>

        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <div>
                <h3 class="font-bold text-slate-900 text-lg">Registrar Ocorrência</h3>
                <p class="text-xs text-slate-500 font-medium">Relate problemas ou necessidades</p>
            </div>
            <button id="btn-close-occurrence" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                <i data-lucide="x" class="h-5 w-5 text-slate-400"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Categoria -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Categoria</label>
                <select id="occ-category" class="w-full rounded-xl border-slate-200 bg-slate-50/50 text-sm focus:ring-blue-500 focus:border-blue-500 py-3">
                    <option value="GENERAL">Ocorrência Geral</option>
                    <option value="BLOCKING">Impeditiva (Para o serviço)</option>
                    <option value="MATERIAL_REQUEST">Solicitação de Material</option>
                </select>
            </div>

            <!-- Tipo -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Tipo</label>
                <select id="occ-type" class="w-full rounded-xl border-slate-200 bg-slate-50/50 text-sm focus:ring-blue-500 focus:border-blue-500 py-3">
                    <option value="OTHER">Outro</option>
                    <option value="DELAY">Atraso</option>
                    <option value="MATERIAL_MISSING">Falta de Material</option>
                    <option value="CUSTOMER_ABSENT">Cliente Ausente</option>
                    <option value="IMPEDIMENT">Impedimento no Local</option>
                    <option value="WARRANTY_ISSUE">Garantia</option>
                </select>
            </div>

            <!-- Descrição -->
            <div class="space-y-1.5">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Descrição detalhada</label>
                <textarea id="occ-description" rows="3" class="w-full rounded-xl border-slate-200 bg-slate-50/50 text-sm focus:ring-blue-500 focus:border-blue-500 py-3 px-4" placeholder="O que aconteceu?"></textarea>
            </div>

            <!-- Evidências (Opcional) -->
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Evidências (Opcional)</label>
                    <span id="occ-media-count" class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">0 mídias</span>
                </div>
                
                <div id="occ-media-grid" class="grid grid-cols-3 gap-2">
                    <!-- Botão de Adicionar -->
                    <button id="btn-occ-add-media" class="aspect-square rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-blue-500 hover:border-blue-200 hover:bg-blue-50 transition-all group">
                        <i data-lucide="plus" class="h-6 w-6 group-hover:scale-110 transition-transform"></i>
                        <span class="text-[10px] font-bold uppercase tracking-tighter">Adicionar</span>
                    </button>
                    <!-- As mídias capturadas serão injetadas aqui dinamicamente -->
                </div>
                <p class="text-[10px] text-slate-400 leading-tight">
                    <i data-lucide="info" class="h-3 w-3 inline-block mr-0.5 align-text-bottom"></i>
                    Fotos ajudam na análise técnica e aprovação de orçamentos.
                </p>
            </div>
        </div>

        <div class="p-6 bg-slate-50/80 backdrop-blur-sm border-t border-slate-100 safe-area-pb">
            <button id="btn-confirm-occurrence" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-amber-200 active:scale-95 transition-all flex items-center justify-center gap-2">
                <i data-lucide="save" class="h-5 w-5"></i>
                SALVAR OCORRÊNCIA
            </button>
        </div>
    </div>
</div>

<!-- Modal de Câmera Live (Sprint 5) -->
<div id="modal-camera" class="hidden fixed inset-0 z-[110] bg-black flex flex-col overflow-hidden">
    <!-- Camera Preview Area -->
    <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
        <video id="camera-video" autoplay playsinline class="w-full h-full object-cover"></video>
        
        <!-- UI Overlays -->
        <div class="absolute top-0 left-0 right-0 p-4 flex items-center justify-between bg-gradient-to-b from-black/60 to-transparent">
            <button id="btn-close-camera" class="p-2 text-white bg-white/10 rounded-full backdrop-blur-md">
                <i data-lucide="x" class="h-6 w-6"></i>
            </button>
            <div id="camera-count" class="px-3 py-1 rounded-full bg-blue-600 text-white text-xs font-bold shadow-lg">0 fotos</div>
        </div>

        <!-- Capture Trigger (Center Bottom) -->
        <div class="absolute bottom-10 left-0 right-0 flex flex-col items-center gap-6">
            <!-- Grid de miniaturas capturadas (Live) -->
            <div id="camera-preview-grid" class="flex gap-2 overflow-x-auto px-4 max-w-full no-scrollbar">
                <!-- Miniaturas temporárias -->
            </div>

            <div class="flex items-center gap-12">
                <button id="btn-toggle-camera" class="p-4 text-white bg-white/10 rounded-full backdrop-blur-md">
                    <i data-lucide="refresh-cw" class="h-6 w-6"></i>
                </button>
                
                <button id="btn-capture-shot" class="w-20 h-20 rounded-full border-4 border-white p-1 shadow-2xl active:scale-90 transition-transform">
                    <div class="w-full h-full rounded-full bg-white"></div>
                </button>

                <button id="btn-confirm-camera" class="p-4 text-white bg-blue-600 rounded-full shadow-lg shadow-blue-900/40">
                    <i data-lucide="check" class="h-6 w-6"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Canvas Oculto para Captura -->
    <canvas id="camera-canvas" class="hidden"></canvas>
</div>

<!-- Modal de Visualização de Mídia (Zoom) / Sprint UX -->
<div id="modal-media-viewer" class="hidden fixed inset-0 z-[120] bg-black/95 backdrop-blur-md items-center justify-center p-4">
    <div class="absolute top-0 left-0 right-0 p-4 flex justify-between z-10 bg-gradient-to-b from-black/50 to-transparent">
        <div class="flex-1"></div>
        <button id="btn-close-viewer" class="h-10 w-10 bg-white/10 hover:bg-white/20 active:bg-white/30 rounded-full flex items-center justify-center text-white backdrop-blur-md transition-colors border border-white/10">
            <i data-lucide="x" class="h-5 w-5"></i>
        </button>
    </div>
    
    <div id="media-viewer-content" class="w-full max-w-4xl h-[80%] flex flex-col items-center justify-center relative">
        <!-- Botão Anterior -->
        <button id="btn-prev-media" class="hidden absolute left-0 top-1/2 -translate-y-1/2 -translate-x-2 md:-translate-x-12 h-12 w-12 bg-white/10 hover:bg-white/20 active:scale-90 rounded-full flex items-center justify-center text-white backdrop-blur-md transition-all border border-white/10 z-20">
            <i data-lucide="chevron-left" class="h-8 w-8"></i>
        </button>

        <!-- Container da Mídia -->
        <div id="media-viewer-display" class="w-full h-full flex items-center justify-center">
             <!-- Injetado dinamicamente via JS -->
        </div>

        <!-- Botão Próximo -->
        <button id="btn-next-media" class="hidden absolute right-0 top-1/2 -translate-y-1/2 translate-x-2 md:translate-x-12 h-12 w-12 bg-white/10 hover:bg-white/20 active:scale-90 rounded-full flex items-center justify-center text-white backdrop-blur-md transition-all border border-white/10 z-20">
            <i data-lucide="chevron-right" class="h-8 w-8"></i>
        </button>
        
        <!-- Contador de Mídia (Badge) -->
        <div id="media-viewer-counter" class="absolute -bottom-10 left-1/2 -translate-x-1/2 px-4 py-1.5 bg-white/10 backdrop-blur-md border border-white/10 rounded-full text-white text-xs font-medium tracking-wider">
            0 / 0
        </div>
    </div>
</div>
