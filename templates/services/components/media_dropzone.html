{% if not is_subform %}
<form method="post" enctype="multipart/form-data" class="space-y-4" id="media-form">
    {% csrf_token %}
{% endif %}

<div class="dz-container w-full">
    <div class="grid grid-cols-2 gap-4">
        <label class="flex flex-col items-center justify-center w-full min-h-[140px] border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50 hover:bg-blue-50 hover:border-blue-300 transition-all cursor-pointer group relative">
            <div class="flex flex-col items-center justify-center pt-5 pb-6 text-slate-500 pointer-events-none">
                <i data-lucide="image" class="h-8 w-8 text-blue-500 mb-2 group-hover:scale-110 transition-transform"></i>
            <p class="text-sm font-bold text-slate-900">Galeria / Arquivos</p>
            <p class="text-[10px] text-slate-400 text-center">Selecione do seu dispositivo</p>
        </div>
        <input 
            type="file" 
            name="{{ dropzone_name|default:'files' }}" 
            id="{{ dropzone_id|default:'id_files' }}" 
            class="dz-input absolute inset-0 w-full h-full opacity-0 cursor-pointer {{ additional_classes|default:'' }}" 
            accept="image/*,video/*,.pdf,.mp3" 
            multiple
            data-preview="true">
    </label>

        <button type="button" onclick="MediaDropzoneManager.openCamera(document.getElementById('{{ dropzone_id|default:'id_files' }}'))" class="flex flex-col items-center justify-center w-full min-h-[140px] border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50 hover:bg-blue-50 hover:border-blue-300 transition-all cursor-pointer group relative">
            <div class="flex flex-col items-center justify-center pt-5 pb-6 text-slate-500">
                <i data-lucide="camera" class="h-8 w-8 text-blue-500 mb-2 group-hover:scale-110 transition-transform"></i>
                <p class="text-sm font-bold text-slate-900">Câmera Rápida</p>
                <p class="text-[10px] text-slate-400 text-center">Tire várias fotos<br>em sequência</p>
            </div>
        </button>
    </div>

    <div class="dz-preview-container grid grid-cols-2 md:grid-cols-4 gap-3 mt-4 empty:mt-0"></div>
    
    {% if not is_subform %}
    <div class="mt-4 flex justify-end">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2">
            <i data-lucide="upload" class="h-5 w-5"></i>
            Enviar Arquivos
        </button>
    </div>
    {% endif %}
</div>

{% if not is_subform %}
</form>
{% endif %}
