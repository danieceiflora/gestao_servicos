<!DOCTYPE html>
<html>
<body>
    <script>
        // Envia os dados para a janela pai
        window.parent.postMessage({
            {% if type %}
            type: '{{ type }}',
            {% else %}
            type: 'objectCreated',
            model: '{{ model }}',
            id: '{{ object.id }}',
            {% if model == 'client' %}
            name: '{{ object.name }}'
            {% else %}
            name: '{{ object.address }}, {{ object.number }}'
            {% endif %}
            {% endif %}
        }, '*');
    </script>
    <div style="font-family: sans-serif; text-align: center; padding: 40px;">
        <h2 style="color: #10b981;">Sucesso!</h2>
        <p>{% if message %}{{ message }}{% else %}Registro salvo. Esta janela fechará automaticamente...{% endif %}</p>
    </div>
</body>
</html>
