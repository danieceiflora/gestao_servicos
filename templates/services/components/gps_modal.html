<!-- GPS Selector Modal -->
<div id="gps-modal" class="fixed inset-0 z-[100] hidden">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" id="gps-modal-overlay"></div>
    
    <!-- Sheet -->
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl p-6 shadow-2xl transform transition-transform translate-y-full" id="gps-modal-sheet">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-lg font-bold text-slate-900">Navegar com...</h3>
            <button type="button" class="p-2 text-slate-400 hover:text-slate-600" id="gps-modal-close">
                <i data-lucide="x" class="h-6 w-6"></i>
            </button>
        </div>
        
        <div class="grid gap-3">
            <!-- Google Maps -->
            <button type="button" id="btn-google-maps" class="flex items-center gap-4 w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 hover:bg-blue-50 hover:border-blue-100 transition-all group">
                <div class="w-12 h-12 rounded-xl bg-white shadow-sm flex items-center justify-center shrink-0">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/aa/Google_Maps_icon_%282020%29.svg" class="h-7 w-7" alt="Google Maps">
                </div>
                <div class="text-left">
                    <p class="font-bold text-slate-900">Google Maps</p>
                    <p class="text-xs text-slate-500">Navegação padrão e rotas</p>
                </div>
                <i data-lucide="chevron-right" class="h-5 w-5 text-slate-300 ml-auto group-hover:text-blue-400"></i>
            </button>

            <!-- Waze -->
            <button type="button" id="btn-waze" class="flex items-center gap-4 w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 hover:bg-sky-50 hover:border-sky-100 transition-all group">
                <div class="w-12 h-12 rounded-xl bg-white shadow-sm flex items-center justify-center shrink-0">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/66/Waze_icon.svg" class="h-7 w-7" alt="Waze">
                </div>
                <div class="text-left">
                    <p class="font-bold text-slate-900">Waze</p>
                    <p class="text-xs text-slate-500">Trânsito em tempo real</p>
                </div>
                <i data-lucide="chevron-right" class="h-5 w-5 text-slate-300 ml-auto group-hover:text-sky-400"></i>
            </button>

            <!-- Apple Maps (opcional, aparece apenas se for iOS) -->
            <button type="button" id="btn-apple-maps" class="hidden flex items-center gap-4 w-full p-4 rounded-2xl bg-slate-50 border border-slate-100 hover:bg-slate-100 transition-all group">
                <div class="w-12 h-12 rounded-xl bg-white shadow-sm flex items-center justify-center shrink-0">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/df/Apple_Maps_logo.svg" class="h-7 w-7" alt="Apple Maps">
                </div>
                <div class="text-left">
                    <p class="font-bold text-slate-900">Apple Maps</p>
                    <p class="text-xs text-slate-500">Nativo do iOS</p>
                </div>
                <i data-lucide="chevron-right" class="h-5 w-5 text-slate-300 ml-auto group-hover:text-slate-400"></i>
            </button>
        </div>
        
        <div class="mt-6 pt-4 border-t border-slate-100">
            <p class="text-[10px] text-center text-slate-400 uppercase tracking-widest font-bold" id="gps-dest-label">Destino: Selecionando...</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const triggers = document.querySelectorAll('[data-gps-trigger="true"]');
        const modal = document.getElementById('gps-modal');
        const overlay = document.getElementById('gps-modal-overlay');
        const sheet = document.getElementById('gps-modal-sheet');
        const closeBtn = document.getElementById('gps-modal-close');
        const destLabel = document.getElementById('gps-dest-label');
        
        const btnGoogle = document.getElementById('btn-google-maps');
        const btnWaze = document.getElementById('btn-waze');
        const btnApple = document.getElementById('btn-apple-maps');

        let currentData = null;

        if (!modal || !sheet || !btnGoogle) return;

        // Detecta se é iOS para mostrar Apple Maps
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS && btnApple) btnApple.classList.remove('hidden');

        function openModal(data) {
            currentData = data;
            if (destLabel) destLabel.textContent = `Destino: ${data.address || 'Coordenadas'}`;
            
            modal.classList.remove('hidden');
            // Pequeno delay para a animação funcionar
            setTimeout(() => {
                sheet.classList.remove('translate-y-full');
            }, 10);
        }

        function closeModal() {
            sheet.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                currentData = null;
            }, 300);
        }

        function getCleanCoords() {
            const lat = (currentData?.lat || '').toString().replace(',', '.').trim();
            const lng = (currentData?.lng || '').toString().replace(',', '.').trim();
            const hasCoords = lat && lng && lat !== '0' && lng !== '0';
            return { lat, lng, hasCoords };
        }

        // Eventos dos botões de GPS
        if (btnGoogle) {
            btnGoogle.addEventListener('click', function() {
                if (!currentData) return;
                const { lat, lng, hasCoords } = getCleanCoords();
                const dest = hasCoords ? `${lat},${lng}` : currentData.address;
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank');
                closeModal();
            });
        }

        if (btnWaze) {
            btnWaze.addEventListener('click', function() {
                if (!currentData) return;
                const { lat, lng, hasCoords } = getCleanCoords();
                let url;
                if (hasCoords) {
                    url = `https://www.waze.com/ul?ll=${lat},${lng}&navigate=yes`;
                } else {
                    url = `https://www.waze.com/ul?q=${encodeURIComponent(currentData.address)}&navigate=yes`;
                }
                window.open(url, '_blank');
                closeModal();
            });
        }

        if (btnApple) {
            btnApple.addEventListener('click', function() {
                if (!currentData) return;
                const { lat, lng, hasCoords } = getCleanCoords();
                const dest = hasCoords ? `${lat},${lng}` : currentData.address;
                window.open(`https://maps.apple.com/?daddr=${encodeURIComponent(dest)}`, '_blank');
                closeModal();
            });
        }

        // Controles do Modal
        triggers.forEach(button => {
            button.addEventListener('click', () => {
                openModal({
                    lat: button.dataset.gpsLat,
                    lng: button.dataset.gpsLng,
                    address: button.dataset.gpsAddress
                });
            });
        });

        if (overlay) overlay.addEventListener('click', closeModal);
        if (closeBtn) closeBtn.addEventListener('click', closeModal);
    });
</script>
