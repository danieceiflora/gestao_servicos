<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-bold uppercase tracking-wider
    {% if status == 'FINISHED' %}bg-green-100 text-green-700
    {% elif status == 'WAITING_BUDGET' %}bg-blue-100 text-blue-700
    {% elif status == 'BUDGET_SCHEDULED' %}bg-indigo-100 text-indigo-700
    {% elif status == 'WAITING_APPROVAL' %}bg-amber-100 text-amber-700
    {% elif status == 'APPROVED_WAITING_SCHEDULE' %}bg-emerald-100 text-emerald-700
    {% elif status == 'WAITING_EXECUTION' %}bg-purple-100 text-purple-700
    {% elif status == 'CANCELLED' %}bg-red-100 text-red-700
    {% else %}bg-slate-100 text-slate-700{% endif %}">
    {{ label }}
</span>
