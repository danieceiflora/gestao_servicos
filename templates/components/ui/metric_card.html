<article class="ui-card p-4 sm:p-5"><div class="flex items-center justify-between gap-3"><div><p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">{{ label }}</p><p class="mt-1 text-2xl font-bold tracking-tight text-slate-900">{{ value }}</p>{% if helper %}<p class="mt-1 text-xs text-slate-500">{{ helper }}</p>{% endif %}</div><span class="flex h-10 w-10 items-center justify-center rounded-xl {% if tone == 'emerald' %}bg-emerald-50 text-emerald-600{% elif tone == 'amber' %}bg-amber-50 text-amber-600{% elif tone == 'red' %}bg-red-50 text-red-600{% else %}bg-blue-50 text-blue-600{% endif %}"><i data-lucide="{{ icon }}" class="h-5 w-5"></i></span></div></article>
