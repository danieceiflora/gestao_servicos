<header class="ui-page-header">
  <div class="ui-page-title-group">
    <span class="ui-page-icon"><i data-lucide="{{ icon|default:'layout-dashboard' }}" class="h-5 w-5"></i></span>
    <div class="min-w-0"><h1 class="ui-page-title">{{ title }}</h1>{% if subtitle %}<p class="ui-page-subtitle">{{ subtitle }}</p>{% endif %}</div>
  </div>
  {% if back_url %}<a href="{{ back_url }}" class="ui-button ui-button-secondary"><i data-lucide="arrow-left" class="h-4 w-4"></i>{{ back_label|default:'Voltar' }}</a>{% endif %}
</header>
