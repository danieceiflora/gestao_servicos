version: '3.3'

services:
  web:
    build: .
    container_name: service_management_web
    restart: always
    cpus: "1.0"
    volumes:
      - ./db_v2.sqlite3:/app/db_v2.sqlite3
      - ./media:/app/media
      - static_volume:/app/staticfiles
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
    expose:
      - "8001"

  media_worker:
    build: .
    container_name: service_management_media_worker
    restart: always
    cpus: "1.0"
    entrypoint: ["python", "manage.py", "process_media_queue"]
    volumes:
      - ./db_v2.sqlite3:/app/db_v2.sqlite3
      - ./media:/app/media
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    container_name: service_management_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web

  # Serviço para renovação automática do certificado
  certbot:
    image: certbot/certbot
    container_name: service_management_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: always

volumes:
  static_volume:
