version: '3.8'

services:
  web:
    build: .
    container_name: service_management_web
    restart: always
    volumes:
      - ./db_v2.sqlite3:/app/db_v2.sqlite3
      - ./media:/app/media
      - static_volume:/app/staticfiles
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
    expose:
      - "8001"

  nginx:
    image: nginx:alpine
    container_name: service_management_nginx
    restart: always
    ports:
      - "8001:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - web

volumes:
  static_volume:
