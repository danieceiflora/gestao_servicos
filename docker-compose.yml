version: '3.3'

services:
  web:
    build: .
    container_name: service_management_web
    restart: always
    volumes:
      - ./db_v2.sqlite3:/app/db_v2.sqlite3
      - ./media:/app/media
      - static_volume:/app/staticfiles
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
    expose:
      - "8001"

  # Serviço que inicializa e gera o certificado SSL
  certbot-init:
    image: certbot/certbot
    container_name: service_management_certbot_init
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./init-ssl.sh:/init-ssl.sh
    entrypoint: /bin/sh
    command: /init-ssl.sh
    network_mode: "host"

  nginx:
    image: nginx:alpine
    container_name: service_management_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
      - certbot-init

  # Serviço para renovação automática do certificado
  certbot:
    image: certbot/certbot
    container_name: service_management_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: always

volumes:
  static_volume:

