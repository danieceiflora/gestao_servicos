version: '3.3'

services:
  web:
    build: .
    container_name: service_management_web
    restart: always
    volumes:
      - ./db_v2.sqlite3:/app/db_v2.sqlite3
      - ./media:/app/media
      - static_volume:/app/staticfiles
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
    expose:
      - "8001"

  nginx:
    image: nginx:alpine
    container_name: service_management_nginx
    restart: always
    ports:
      - "8001:80"
      - "443:443" # Expondo a porta HTTPS padrão
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # O comando deixaremos para executar pontualmente depois

volumes:
  static_volume:
