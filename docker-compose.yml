version: '3.3'

services:
  db:
    image: postgres:15-alpine
    container_name: service_management_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=gestao_servicos
      - POSTGRES_USER=gestao_user
      - POSTGRES_PASSWORD=gestao_password
    restart: always

  web:
    build: .
    container_name: service_management_web
    restart: always
    cpus: "1.0"
    volumes:
      - ./media:/app/media
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://gestao_user:gestao_password@db:5432/gestao_servicos
    expose:
      - "8001"
    depends_on:
      - db

  media_worker:
    build: .
    container_name: service_management_media_worker
    restart: always
    cpus: "1.0"
    entrypoint: ["/bin/sh", "-c", "until python manage.py migrate --check 2>/dev/null; do echo 'Aguardando migrations...'; sleep 5; done && python manage.py process_media_queue"]
    volumes:
      - ./media:/app/media
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://gestao_user:gestao_password@db:5432/gestao_servicos
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: service_management_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web

  # Serviço para renovação automática do certificado
  certbot:
    image: certbot/certbot
    container_name: service_management_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: always

volumes:
  static_volume:
  postgres_data:
